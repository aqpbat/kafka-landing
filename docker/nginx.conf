server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Behind a mapped port (8080:80) absolute redirects would point at :80.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;
  gzip_min_length 1024;

  error_page 404 /404.html;

  # One URL per page for search engines: /products/ → /products.
  rewrite ^/(.+)/$ /$1 permanent;

  # Hashed build assets never change.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /logos/ {
    expires 7d;
  }

  location / {
    # /products → /products/index.html directly, no trailing-slash redirect.
    try_files $uri $uri/index.html $uri.html =404;
    add_header Cache-Control "no-cache";
  }
}
